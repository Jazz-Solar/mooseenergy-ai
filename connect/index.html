<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Connect a site · Moose</title><link rel="stylesheet" href="./connect.css?v=20261028"></head>
<body><main><header><a href="/">Moose</a><span id="environment"></span><button id="signout" hidden>Sign out</button></header>
<h1>Connect a solar site</h1><p id="intro">Sign in with the email assigned to the connection request. The owner will see the site's connection progress in Moose.</p>
<p id="error" role="alert"></p><p id="notice" role="status" aria-live="polite"></p>
<form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><p>Need an account? <a id="signup" href="/app/">Create one in Moose</a>, verify your email, then return to this link.</p></form>
<section id="workspace" hidden><nav aria-label="Your connection requests" id="requests"></nav><article id="request"></article></section>
</main><script type="module" src="./connect.js?v=20261028"></script></body></html>
