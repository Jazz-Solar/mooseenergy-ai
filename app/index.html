<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the Moose App</title>
<meta name="description" content="Download Moose Energy, the solar management app, for iPhone or Android.">
<style>
:root{--ink:#14130F;--gold:#F7BB27;--mute:#9a978c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--ink);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
.wrap{max-width:640px;width:100%}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.brand img{width:56px;height:56px;object-fit:contain}
.brand b{font-size:24px;color:var(--gold);letter-spacing:-.02em}
h1{font-size:30px;letter-spacing:-.02em;margin-bottom:8px}
p.sub{color:var(--mute);margin-bottom:32px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#1f1d18;border:1px solid #2e2b24;border-radius:16px;padding:22px}
.card h2{font-size:18px;margin-bottom:14px}
.qr{background:#fff;border-radius:10px;padding:10px;width:170px;margin:0 auto 16px}
.qr img{width:100%;display:block;image-rendering:pixelated}
.btn{display:block;background:var(--gold);color:var(--ink);font-weight:700;text-decoration:none;padding:13px 16px;border-radius:999px}
.btn:hover{filter:brightness(1.06)}
.note{color:var(--mute);font-size:13px;margin-top:26px}
@media (max-width:560px){.cards{grid-template-columns:1fr}.qr{display:none}}
</style>
<script>
(function(){
  var ua=navigator.userAgent||'';
  var ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var android=/Android/i.test(ua);
  if(location.search.indexOf('stay')>-1)return;
  if(ios)location.replace('https://apps.apple.com/ca/app/moose-solar/id6756133852');
  else if(android)location.replace('https://play.google.com/store/apps/details?id=com.moose.solar');
})();
</script>
</head>
<body>
<main class="wrap">
  <div class="brand"><img src="/moose-logo.png" alt=""><b>Moose Energy</b></div>
  <h1>Get the Moose app</h1>
  <p class="sub">Scan with your phone camera, or tap your store below.</p>
  <div class="cards">
    <section class="card">
      <h2>iPhone</h2>
      <div class="qr"><img src="qr-ios.svg" alt="QR code for the Moose app on the App Store"></div>
      <a class="btn" href="https://apps.apple.com/ca/app/moose-solar/id6756133852">App Store</a>
    </section>
    <section class="card">
      <h2>Android</h2>
      <div class="qr"><img src="qr-android.svg" alt="QR code for the Moose app on Google Play"></div>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.moose.solar">Google Play</a>
    </section>
  </div>
  <p class="note">Already have it? Open Moose and sign in.</p>
</main>
</body>
</html>
