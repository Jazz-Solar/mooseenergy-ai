<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Moose — Admin</title>
  <style>
    :root { --bg:#0a0a0a; --card:#141414; --line:#1f1f1f; --text:#fafafa; --dim:#71717a; --dimmer:#52525b; --amber:#f59e0b; --green:#22c55e; --red:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
    .wrap { max-width:1100px; margin:0 auto; padding:32px 20px 60px; }
    h1 { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
    .sub { color:var(--dimmer); font-size:12px; margin-top:4px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:20px; }
    label { display:block; color:var(--dim); font-size:11px; font-weight:600; letter-spacing:0.8px; margin:14px 0 6px; }
    input { width:100%; background:#0f0f0f; border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--text); font-size:15px; }
    input:focus { outline:none; border-color:var(--amber); }
    button { margin-top:18px; width:100%; background:var(--amber); color:#0a0a0a; font-size:15px; font-weight:700; border:none; border-radius:12px; padding:14px; cursor:pointer; }
    button:hover { background:#d97706; }
    .error { color:var(--red); font-size:13px; margin-top:12px; }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:20px; }
    .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center; }
    .tile b { display:block; font-size:26px; font-weight:700; }
    .tile span { color:var(--dimmer); font-size:11px; letter-spacing:0.5px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
    th { text-align:left; color:var(--dimmer); font-size:10px; letter-spacing:0.8px; padding:8px 10px; border-bottom:1px solid var(--line); }
    td { padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600; }
    .pill.owner { background:#f59e0b22; color:var(--amber); }
    .pill.admin { background:#22c55e22; color:var(--green); }
    .pill.technician { background:#60a5fa22; color:#60a5fa; }
    .ok { color:var(--green); } .fail { color:var(--red); }
    .dim { color:var(--dim); } .dimmer { color:var(--dimmer); font-size:11px; }
    .right { text-align:right; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; }
    .signout { width:auto; margin:0; background:transparent; border:1px solid var(--line); color:var(--dim); font-weight:500; font-size:12px; padding:8px 14px; }
    .signout:hover { background:#181818; color:var(--text); }
    .fb-msg { color:var(--dim); font-size:12px; max-width:480px; }
    .scroll { overflow-x:auto; }
    h2 { font-size:14px; font-weight:600; margin-top:28px; }
    @media (max-width:640px){ .hide-sm { display:none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>🫎 Moose Admin</h1>
        <div class="sub" id="subtitle">Sign in with your @jazzsolar.com Moose account</div>
      </div>
      <button class="signout" id="signout" style="display:none">Sign out</button>
    </div>

    <div class="card" id="login">
      <label>EMAIL</label>
      <input id="email" type="email" placeholder="you@jazzsolar.com" autocomplete="username" />
      <label>PASSWORD</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button id="signin">Sign In</button>
      <div class="error" id="err"></div>
    </div>

    <div id="dash" style="display:none">
      <div class="tiles" id="tiles"></div>
      <h2>USERS</h2>
      <div class="card scroll" style="padding:6px 10px">
        <table id="users"><thead><tr>
          <th>USER</th><th>ROLE</th><th class="hide-sm">SYSTEMS</th>
          <th class="right">LOGINS 7D</th><th class="right hide-sm">30D</th>
          <th class="right">FEEDBACK</th><th class="hide-sm">LAST SEEN</th><th class="hide-sm">JOINED</th>
        </tr></thead><tbody></tbody></table>
      </div>
      <h2>FEEDBACK FEED <span class="dimmer">(everything, including failed HubSpot deliveries)</span></h2>
      <div class="card scroll" style="padding:6px 10px">
        <table id="fb"><thead><tr>
          <th>WHEN</th><th>WHO</th><th>TYPE</th><th>MESSAGE</th><th>HUBSPOT</th>
        </tr></thead><tbody></tbody></table>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SUPABASE_URL = 'https://rcwynvzgzzywrormxlqp.supabase.co';
    const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjd3ludnpnenp5d3Jvcm14bHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjM0MDQsImV4cCI6MjA5NTczOTQwNH0.wYq7WoBKvX18TFiqyWv9qfDkP6mrGfcHaSUV6b2iMjs';
    const supabase = createClient(SUPABASE_URL, ANON);

    const $ = (id) => document.getElementById(id);
    const fmt = (iso) => iso ? new Date(iso).toLocaleString('en-CA', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '—';
    const fmtD = (iso) => iso ? new Date(iso).toLocaleDateString('en-CA', { month:'short', day:'numeric' }) : '—';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function loadDash() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      $('subtitle').textContent = 'Loading…';
      const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-stats`, {
        method: 'POST',
        headers: { apikey: ANON, Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
        body: '{}',
      });
      const d = await res.json();
      if (!d.ok) {
        $('err').textContent = d.error ?? 'Not authorized.';
        $('subtitle').textContent = 'Sign in with your @jazzsolar.com Moose account';
        await supabase.auth.signOut();
        return;
      }
      $('login').style.display = 'none';
      $('dash').style.display = 'block';
      $('signout').style.display = 'block';
      $('subtitle').textContent = `Signed in as ${session.user.email} · data as of ${fmt(d.generated_at)}`;

      const activeToday = d.users.filter(u => u.last_sign_in_at && Date.now() - new Date(u.last_sign_in_at) < 864e5).length;
      $('tiles').innerHTML = [
        [d.totals.users, 'USERS'],
        [d.totals.systems, 'SYSTEMS'],
        [activeToday, 'ACTIVE TODAY'],
        [d.totals.feedback, 'FEEDBACK ALL-TIME'],
      ].map(([v, l]) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('');

      $('users').querySelector('tbody').innerHTML = d.users.map(u => `
        <tr>
          <td><b>${esc(u.name) || '—'}</b><br><span class="dimmer">${esc(u.email)}</span></td>
          <td><span class="pill ${esc(u.role)}">${esc(u.role)}</span></td>
          <td class="hide-sm dim">${u.systems.length ? esc(u.systems.join(', ')) : '—'}</td>
          <td class="right">${u.logins_7d}</td>
          <td class="right hide-sm">${u.logins_30d}</td>
          <td class="right">${u.feedback_count}</td>
          <td class="hide-sm dim">${fmt(u.last_sign_in_at)}</td>
          <td class="hide-sm dim">${fmtD(u.created_at)}</td>
        </tr>`).join('');

      $('fb').querySelector('tbody').innerHTML = d.feedback.length
        ? d.feedback.map(f => `
          <tr>
            <td class="dim">${fmt(f.at)}</td>
            <td class="dim">${esc(f.email)}</td>
            <td>${esc(f.category)}</td>
            <td><b>${esc(f.subject) || '—'}</b><div class="fb-msg">${esc(f.message)}</div></td>
            <td>${f.hubspot_ok ? `<span class="ok">✓ ${esc(f.ticket)}</span>` : '<span class="fail">✗ not delivered</span>'}</td>
          </tr>`).join('')
        : '<tr><td colspan="5" class="dim">No feedback yet.</td></tr>';
    }

    $('signin').onclick = async () => {
      $('err').textContent = '';
      const { error } = await supabase.auth.signInWithPassword({
        email: $('email').value.trim().toLowerCase(),
        password: $('password').value,
      });
      if (error) { $('err').textContent = 'Sign-in failed: ' + error.message; return; }
      await loadDash();
    };
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('signin').click(); });
    $('signout').onclick = async () => { await supabase.auth.signOut(); location.reload(); };

    loadDash(); // restore an existing session on page load
  </script>
</body>
</html>
